<ion-list>
  @for (group of tasksGrouped$ | async; track $index) {
    <ion-item-divider>
      <ion-label>{{ group.label }}</ion-label>
    </ion-item-divider>
    @for (tarea of group.items; track tarea.id ?? $index) {
      <ion-item class="flat-item">
        <ion-checkbox
          slot="start"
          [checked]="tarea.completada"
          (ionChange)="onToggle(tarea, $event.detail.checked)">
        </ion-checkbox>

        <ion-label>
          <h2>{{ tarea.titulo }}</h2>

          @if (tarea.descripcion) {
            <p>{{ tarea.descripcion }}</p>
          } @else {
            <p>Sin descripcion</p>
          }
        </ion-label>

        <ion-icon
        [routerLink]="['/detalle-tarea', tarea.id]"
          slot="end"
          name="chevron-forward-outline">
        </ion-icon>
      </ion-item>
    }
  }
</ion-list>
@if(isLoading){
<app-loader></app-loader>
}
